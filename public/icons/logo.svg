<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Master mark for تطبيق الشركاء. Two discs overlapping into a shared
       middle: the whole app is two partners keeping one set of books, and
       the part they hold in common is the brightest thing in it.
       No text, so it survives at 48px on a home screen. The ground is
       full-bleed rather than a rounded square, because Android masks
       maskable icons to its own shape and would clip a corner radius; the
       mark sits well inside the safe circle (180px from centre, safe is 205). -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16233c"/>
      <stop offset="1" stop-color="#0a0f1c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.34" r="0.66">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <!-- The two discs are pushed apart in value, not just hue: at 32px a pair
         of near-identical cyans reads as one blob with a stripe through it. -->
    <linearGradient id="discA" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#a5e8ff"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="discB" x1="0.9" y1="0" x2="0.1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#0c6d8a"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#ground)"/>
  <rect width="512" height="512" fill="url(#glow)"/>

  <circle cx="204" cy="256" r="104" fill="url(#discA)"/>
  <circle cx="308" cy="256" r="104" fill="url(#discB)"/>
  <!-- The shared middle, drawn as an explicit lens rather than left to a
       blend mode, so every renderer produces the same shape. -->
  <path d="M 256 165.94 A 104 104 0 0 1 256 346.06 A 104 104 0 0 1 256 165.94 Z"
        fill="#ffffff" fill-opacity="0.96"/>
</svg>
